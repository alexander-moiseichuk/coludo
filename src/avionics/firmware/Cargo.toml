[package]
name = "firmware"
description = "The Coludo flight firmware for the ESP32-P4 (ESP-IDF, Rust std)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "avionics"
path = "src/main.rs"
harness = false  # no libtest on the board; on-board tests are their own binaries

[dependencies]
cc_protocol.workspace = true
esp-idf-svc = "0.53"
anyhow = "1"
log = "0.4"
serde_json = "1"

[build-dependencies]
embuild = "0.33"

# Wi-Fi rides the on-board ESP32-C6 over SDIO (esp_hosted). Pinned to the exact pair MicroPython v1.29.0
# ships, which talks to the C6 firmware the boards came with -- so the C6 is never reflashed.
[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/esp_wifi_remote", version = "0.15.2" }

[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/esp_hosted", version = "2.7.0" }

# Espressif's DSP kernels: the only route to the P4's PIE SIMD and hardware loops (upstream LLVM, so Rust,
# cannot emit them)
[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/esp-dsp", version = "1.8.2" }

[[package.metadata.esp-idf-sys.extra_components]]
bindings_header = "bindings.h"
